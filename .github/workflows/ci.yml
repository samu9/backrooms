# Tests for both clients on every push and pull request; desktop builds on version tags.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # the lockfile records a private mirror (the author's npm config); install the same packages,
      # same integrity hashes, from the public registry (only CI's copy of the lockfile is rewritten)
      - run: |
          sed -i -E 's#"resolved": "https://[^"]*/npm/npm-store/#"resolved": "https://registry.npmjs.org/#' package-lock.json
          npm ci --registry=https://registry.npmjs.org/
      - name: TypeScript (web client, relay, rules)
        run: npm run typecheck && npm test
      - name: Web build
        run: npm run build
      - name: Golden fixtures are up to date with shared/gen.ts and web/src/chunk.ts
        run: npm run gen:fixtures && git diff --exit-code tests/fixtures
      - name: C# (generator and chunk parity, rules, AI, map, sound)
        run: npm run godot:test

  desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Godot .NET editor and export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLf -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$(ls $RUNNER_TEMP/godot/*/Godot_v*_mono_linux.x86_64)" >> "$GITHUB_ENV"
          curl -sSLf -o tpl.tpz "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q tpl.tpz -d "$RUNNER_TEMP/tpl"
          mkdir -p ~/.local/share/godot/export_templates
          mv "$RUNNER_TEMP/tpl/templates" ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
      - name: Import and export
        run: |
          "$GODOT" --headless --path godot/Game --import || true
          node scripts/godot-export.mjs linux windows
      - uses: actions/upload-artifact@v4
        with:
          name: backrooms-desktop
          path: godot/build/*.zip
